  manifest: manifest.json        # Distilly 引擎清单
  meta: meta.json                # Distilly 引擎元数据
  research: references/research/
  merged_summary: knowledge/research/merged/summary.md
  reviews: knowledge/research/reviews/
  scripts: scripts/

